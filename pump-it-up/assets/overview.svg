<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">Heart, lungs, and body</title><desc id="overview-desc">Schematic double circulation. Oxygen-poor blood travels from body to right heart to lungs; oxygen-rich blood returns to left heart then body.</desc>
<style>text{font-family:Arial,sans-serif} [data-part]{cursor:pointer} [data-part]:focus{outline:none} [data-part].selected,[data-part]:focus-visible{filter:drop-shadow(0 0 4px #d9a334)} .diagram-label{pointer-events:none}</style>
<rect x="0" y="0" width="800" height="640" rx="24" fill="#f3f8fa" stroke="none" stroke-width="2" />
<text class="diagram-heading" x="32" y="39" font-size="24" text-anchor="start" fill="#16344a" font-weight="700">Heart, lungs, and body</text>
<text class="diagram-note" x="32" y="66" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">Two connected circuits: heart to lungs, and heart to body.</text><g id="systemic-veins" data-part="systemic-veins" role="button" tabindex="0" aria-label="Systemic veins"><title>Systemic veins</title><path d="M295 520H180Q145 520 145 480V380Q145 350 180 350H328" stroke="#427ba8" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="42" y="390" font-size="18" text-anchor="start" fill="#16344a" font-weight="700">Veins</text><text class="diagram-label" x="42" y="414" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">to heart</text><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(228 520) rotate(180)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(145 455) rotate(-90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(145 400) rotate(-90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(269 350) rotate(0)" pointer-events="none" /></g><g id="systemic-arteries" data-part="systemic-arteries" role="button" tabindex="0" aria-label="Systemic arteries"><title>Systemic arteries</title><path d="M466 368H610Q645 368 645 405V485Q645 520 610 520H506" stroke="#dc5a62" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="670" y="405" font-size="18" text-anchor="start" fill="#16344a" font-weight="700">Arteries</text><text class="diagram-label" x="670" y="429" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">to body</text><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(551 368) rotate(0)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(645 430) rotate(90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(645 479) rotate(90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(559 520) rotate(180)" pointer-events="none" /></g><g id="pulmonary-arteries" data-part="pulmonary-arteries" role="button" tabindex="0" aria-label="Pulmonary arteries"><title>Pulmonary arteries</title><path d="M345 294H224Q190 294 190 260V179Q190 150 222 150H290" stroke="#427ba8" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="34" y="191" font-size="17" text-anchor="start" fill="#16344a" font-weight="700">Pulmonary</text><text class="diagram-label" x="34" y="214" font-size="17" text-anchor="start" fill="#16344a" font-weight="500">arteries</text><text class="diagram-label" x="34" y="238" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">to lungs</text><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(266 294) rotate(180)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(190 248) rotate(-90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(190 198) rotate(-90)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(254 15