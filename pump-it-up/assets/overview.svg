agram-label" x="400" y="251" font-size="20" text-anchor="middle" fill="#16344a" font-weight="700">Lungs</text></g><g id="heart" data-part="heart" role="button" tabindex="0" aria-label="Heart"><title>Heart</title><path d="M398 296C366 258 320 280 322 327C322 368 367 403 401 425C436 402 481 367 481 327C481 281 433 259 398 296Z" stroke="#16344a" stroke-width="3" fill="#fde8e8" stroke-linecap="round" stroke-linejoin="round" /><path d="M398 296C366 258 320 280 322 327C322 368 367 403 401 425L401 298Z" stroke="none" stroke-width="0" fill="#d7e7f3" stroke-linecap="round" stroke-linejoin="round" /><path d="M401 306V399" stroke="#16344a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="360" y="332" font-size="21" text-anchor="middle" fill="#427ba8" font-weight="700">R</text><text class="diagram-label" x="442" y="332" font-size="21" text-anchor="middle" fill="#dc5a62" font-weight="700">L</text><text class="diagram-label" x="400" y="453" font-size="20" text-anchor="middle" fill="#16344a" font-weight="700">Heart</text></g><g id="body" data-part="body" role="button" tabindex="0" aria-label="Body tissues and capillaries"><title>Body tissues and capillaries</title><rect x="284" y="480" width="232" height="90" rx="24" fill="white" stroke="#b8d7ce" stroke-width="2" /><circle cx="325" cy="510" r="15" fill="#ddede8" stroke="#399f91" stroke-width="2" /><circle cx="325" cy="510" r="5.0" fill="#9acbbe" stroke="none" stroke-width="2" /><circle cx="374" cy="535" r="18" fill="#ddede8" stroke="#399f91" stroke-width="2" /><circle cx="374" cy="535" r="6.0" fill="#9acbbe" stroke="none" stroke-width="2" /><circle cx="420" cy="505" r="16" fill="#ddede8" stroke="#399f91" stroke-width="2" /><circle cx="420" cy="505" r="5.333333333333333" fill="#9acbbe" stroke="none" stroke-width="2" /><circle cx="468" cy="532" r="15" fill="#ddede8" stroke="#399f91" stroke-width="2" /><circle cx="468" cy="532" r="5.0" fill="#9acbbe" stroke="none" stroke-width="2" /><text class="diagram-label" x="400" y="602" font-size="20" text-anchor="middle" fill="#16344a" font-weight="700">Body tissues</text></g><text class="diagram-note" x="400" y="626" font-size="15" text-anchor="middle" fill="#16344a" font-weight="500">Blue: lower oxygen  |  Coral: higher oxygen. Blood is always red.</text>
</svg>