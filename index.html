<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eureka! Science Olympiad Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="Back to the event list">
      <span class="brand-mark" aria-hidden="true">!</span>
      <span class="brand-text">Eureka!</span>
    </button>
    <div class="topbar-tools">
      <label class="toggle" for="readAloud" title="Read questions out loud">
        <input type="checkbox" id="readAloud">
        <span>Read aloud</span>
      </label>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">Practice for the 2027 NC Science Olympiad Division A events &middot; your progress is saved on this device</footer>
</div>

<!-- Question banks: one file per 2027 NC Division A knowledge event.
     Add a new event by adding a file here and one script tag. -->
<script src="questions/beam-me-up.js"></script>
<script src="questions/buzzworthy.js"></script>
<script src="questions/deep-blue-sea.js"></script>
<script src="questions/geology-rocks.js"></script>
<script src="questions/pump-it-up.js"></script>
<script src="questions/roots-reptiles.js"></script>
<script src="questions/science-sketchers.js"></script>
<script src="questions/ship-shape.js"></script>
<script src="questions/storm-chasers.js"></script>
<script src="questions/zap-lab.js"></script>
<script src="app.js"></script>
</body>
</html>
