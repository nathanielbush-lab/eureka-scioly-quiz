<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="exchange-title exchange-desc">
<title id="exchange-title">Where air meets blood</title><desc id="exchange-desc">One alveolus beside a capillary. Oxygen moves from alveolar air to blood; carbon dioxide moves from blood to alveolar air. A separate blood inset shows red cells, white cells, platelets and plasma.</desc>
<style>text{font-family:Arial,sans-serif} [data-part]{cursor:pointer} [data-part]:focus{outline:none} [data-part].selected,[data-part]:focus-visible{filter:drop-shadow(0 0 4px #d9a334)} .diagram-label{pointer-events:none}</style>
<rect x="0" y="0" width="800" height="640" rx="24" fill="#f3f8fa" stroke="none" stroke-width="2" />
<text class="diagram-heading" x="32" y="39" font-size="24" text-anchor="start" fill="#16344a" font-weight="700">Where air meets blood</text>
<text class="diagram-note" x="32" y="66" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">A close-up of one air sac and the blood beside it.</text><g id="alveolus" data-part="alveolus" role="button" tabindex="0" aria-label="Alveolus"><title>Alveolus</title><path d="M222 106V151C162 168 144 220 159 274C175 333 255 353 312 320C356 295 366 248 345 206C332 180 309 162 279 153V106" stroke="#d9a334" stroke-width="5" fill="#fff3d0" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="252" y="220" font-size="22" text-anchor="middle" fill="#16344a" font-weight="700">Alveolus</text><text class="diagram-label" x="252" y="248" font-size="17" text-anchor="middle" fill="#16344a" font-weight="500">air inside</text><text class="diagram-label" x="252" y="135" font-size="16" text-anchor="middle" fill="#16344a" font-weight="500">Airway</text></g><g id="capillaries" data-part="capillaries" role="button" tabindex="0" aria-label="Capillaries"><title>Capillaries</title><path d="M369 166C425 235 385 326 310 354C230 384 147 356 119 293" stroke="#427ba8" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M369 316C353 332 333 346 310 354C230 384 147 356 119 293" stroke="#dc5a62" stroke-width="32" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="494" y="178" font-size="20" text-anchor="start" fill="#16344a" font-weight="700">Capillary</text><text class="diagram-label" x="494" y="202" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">Blood stays inside</text><text class="diagram-label" x="494" y="224" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">the blood vessel.</text><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(395 244) rotate(95)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(302 357) rotate(161)" pointer-events="none" /><path class="flow-arrow" d="M-15 -3H-4V-7L8 0L-4 7V3H-15Z" fill="#fff" stroke="#16344a" stroke-width=".5" transform="translate(179 352) rotate(211)" pointer-events="none" /></g><g id="oxygen" data-part="oxygen" role="button" tabindex="0" aria-label="Oxygen moves from alveolus into blood"><title>Oxygen moves from alveolus into blood</title><path d="M309 270L369 295" stroke="#dc5a62" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 -10L10 0L-10 10Z" fill="#dc5a62" transform="translate(369 295) rotate(22)" /><text class="diagram-label" x="486" y="285" font-size="19" text-anchor="start" fill="#16344a" font-weight="700">Oxygen (O2)</text><text class="diagram-label" x="486" y="309" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">Air sac to blood</text><path d="M472 300H419" stroke="#91a5b1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g id="carbon-dioxide" data-part="carbon-dioxide" role="button" tabindex="0" aria-label="Carbon dioxide moves from blood into alveolus"><title>Carbon dioxide moves from blood into alveolus</title><path d="M389 211L343 213" stroke="#427ba8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 -10L10 0L-10 10Z" fill="#427ba8" transform="translate(343 213) rotate(168)" /><text class="diagram-label" x="486" y="352" font-size="18" text-anchor="start" fill="#16344a" font-weight="700">Carbon dioxide (CO2)</text><text class="diagram-label" x="486" y="376" font-size="16" text-anchor="start" fill="#16344a" font-weight="500">Blood to air sac</text><path d="M475 365H440V210H404" stroke="#91a5b1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text class="diagram-note" x="400" y="433" font-size="16" text-anchor="middle" fill="#16344a" font-weight="700">INSIDE BLOOD  ·  Enlarged examples, not actual proportions</text><g id="plasma" data-part="plasma" role="button" tabindex="0" aria-label="Plasma"><title>Plasma</title><rect x="39" y="452" width="722" height="143" rx="24" fill="#fff0ce" stroke="#e7d6a6" stroke-width="2" /><text class="diagram-label" x="673" y="570" font-size="18" text-anchor="middle" fill="#16344a" font-weight="700">Plasma</text></g><g id="red-cells" data-part="red-cells" role="button" tabindex="0" aria-label="Red blood cells"><title>Red blood cells</title><ellipse cx="130" cy="505" rx="36" ry="24" fill="#dc5a62" stroke="#ac3c4c" stroke-width="2" /><ellipse cx="130" cy="505" rx="17" ry="10" fill="#f19b9f" /><text class="diagram-label" x="130" y="570" font-size="17" text-anchor="middle" fill="#16344a" font-weight="700">Red blood cells</text></g><g id="white-cells" data-part="white-cells" role="button" tabindex="0" aria-label="White blood cells"><title>White blood cells</title><circle cx="315" cy="505" r="29" fill="#fff" stroke="#8d83b2" stroke-width="3" /><path d="M300 496C289 485 321 478 326 492C347 498 326 525 314 518C295 527 285 510 300 496Z" stroke="none" stroke-width="0" fill="#9b8ab7" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="315" y="570" font-size="17" text-anchor="middle" fill="#16344a" font-weight="700">White blood cells</text></g><g id="platelets" data-part="platelets" role="button" tabindex="0" aria-label="Platelets"><title>Platelets</title><path d="M489 487L495 496L505 494L502 505L510 512L498 516L495 526L487 518L477 521L479 509L471 501L483 498Z" stroke="#8873aa" stroke-width="2" fill="#b7a2ce" stroke-linecap="round" stroke-linejoin="round" /><path d="M525 516L531 519L535 525L527 531L521 527Z" stroke="#8873aa" stroke-width="2" fill="#b7a2ce" stroke-linecap="round" stroke-linejoin="round" /><text class="diagram-label" x="497" y="570" font-size="17" text-anchor="middle" fill="#16344a" font-weight="700">Platelets</text></g><text class="diagram-note" x="400" y="624" font-size="16" text-anchor="middle" fill="#16344a" font-weight="500">Blood cells do not enter the air sac. Gases cross the thin walls.</text>
</svg>