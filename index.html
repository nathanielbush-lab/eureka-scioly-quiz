<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eureka! Science Olympiad Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="brand" id="homeBtn" type="button" aria-label="Back to the event list">
      <span class="brand-mark" aria-hidden="true">!</span>
      <span class="brand-text">Eureka!</span>
    </button>
    <div class="topbar-tools">
      <label class="toggle" for="readAloud" title="Read questions out loud">
        <input type="checkbox" id="readAloud">
        <span>Read aloud</span>
      </label>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">Science Olympiad practice &middot; your progress is saved on this device</footer>
</div>

<!-- Question banks. Add a new event by adding a file here and one script tag. -->
<script src="questions/rocks-minerals.js"></script>
<script src="questions/solar-system.js"></script>
<script src="questions/insects.js"></script>
<script src="questions/human-body.js"></script>
<script src="questions/weather.js"></script>
<script src="app.js"></script>
</body>
</html>
