<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="heart-title heart-desc">
<title id="heart-title">Inside the heart</title><desc id="heart-desc">Flow schematic, not an anatomical cutaway. Person’s right is shown at left. Vena cava to right atrium, tricuspid valve, right ventricle, pulmonary valve and arteries. Pulmonary veins to left atrium, mitral valve, left ventricle, aortic valve and aorta.</desc>
<style>text{font-family:Arial,sans-serif} [data-part]{cursor:pointer} [data-part]:focus{outline:none} [data-part].selected,[data-part]:focus-visible{filter:drop-shadow(0 0 4px #d9a334)} .diagram-label{pointer-events:none}</style>
