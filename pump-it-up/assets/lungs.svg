<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="lungs-title lungs-desc">
<title id="lungs-title">Airways and lungs</title><desc id="lungs-desc">Combined side view of the head and front view of lungs. Air passes nose or mouth, pharynx, larynx, trachea, bronchi, bronchioles and alveoli. Right lung has three lobes; left has two. Diaphragm lies below.</desc>
<style>text{font-family:Arial,sans-serif} [data-part]{cursor:pointer} [data-part]:focus{outline:none} [data-part].selected,[data-part]:focus-visible{filter:drop-shadow(0 0 4px #d9a334)} .diagram-label{pointer-events:none}</style>
